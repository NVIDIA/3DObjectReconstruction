[pytest]
# Pytest configuration for 3D reconstruction tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    e2e: marks tests as end-to-end integration tests
    unit: marks tests as unit tests
    gpu: marks tests that require GPU
    
# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes
    
# Timeout for tests (in seconds)
timeout = 3600

# Test paths
testpaths = tests

# Ignore patterns
norecursedirs = .git .tox build dist *.egg data docker deploy

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (if using pytest-cov)
# addopts = --cov=nvidia.objectreconstruction --cov-report=html --cov-report=term
